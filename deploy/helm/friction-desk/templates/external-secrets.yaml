{{- $es := .Values.elasticsearch }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.secretName }}
  labels:
    {{- include "friction-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $es.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $es.apiKeySecretKey }}
      remoteRef:
        key: {{ $es.remoteSecretName | quote }}
        property: api-key
{{- if .Values.keiRuntime.enabled }}
---
{{- $kei := .Values.keiRuntime }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $kei.secretName }}
  labels:
    {{- include "friction-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $kei.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $kei.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $kei.tokenSecretKey }}
      remoteRef:
        key: {{ $kei.remoteSecretName | quote }}
        property: KEI_RUNTIME_TOKEN
{{- end }}
