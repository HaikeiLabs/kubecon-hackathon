{{- $es := .Values.elasticsearch }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $es.secretName }}
  labels:
    {{- include "friction-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $es.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $es.apiKeySecretKey }}
      remoteRef:
        key: {{ $es.remoteSecretName | quote }}
        property: api-key
{{- if .Values.keaRuntime.enabled }}
---
{{- $kea := .Values.keaRuntime }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $kea.secretName }}
  labels:
    {{- include "friction-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $kea.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $kea.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $kea.tokenSecretKey }}
      remoteRef:
        key: {{ $kea.remoteSecretName | quote }}
        property: KEI_RUNTIME_TOKEN
{{- end }}
