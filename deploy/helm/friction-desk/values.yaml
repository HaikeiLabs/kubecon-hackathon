nameOverride: ""

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

elasticsearch:
  # Hosted Elastic deployment URL. The API key stays in Secrets Manager/Kubernetes Secret.
  url: ""
  secretName: friction-desk-elasticsearch
  secretStoreName: aws-secrets-manager
  remoteSecretName: kubecon-hackathon/friction-desk-elasticsearch
  apiKeySecretKey: api-key

keiRuntime:
  enabled: true
  secretName: friction-desk-kei-runtime
  secretStoreName: aws-secrets-manager
  remoteSecretName: kubecon-hackathon/friction-desk-kei-runtime
  tokenSecretKey: KEI_RUNTIME_TOKEN
