[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-friction-desk-api"
version = "0.1.0"
description = "API and Elasticsearch search boundary for the Conference Friction Desk"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch>=8.17,<10",
    "fastapi>=0.115,<1",
    "haikeilabs-agentware>=0.16.0",
    "openai>=3.48.0",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs real Elastic/OpenAI credentials (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
